{% extends 'base.html' %}

{% block content %}
    <h1 class="my-5">These are the notes</h1>

    {% for note in notes %}
        <div class="row row-cols3 g-2">
            <div class="col">
                <div class="p-3 border">
                    <a href="{% url 'note.detail' pk=note.id %}">
                        <h3>{{ note.title }}</h3>
                    </a>
                    {{ note.text|truncatechars:10 }}
                </div>
            </div>
        </div>
    {% endfor %}

{% endblock %}
