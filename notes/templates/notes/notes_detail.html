{% extends 'base.html' %}

{% block content %}
	<div class="my-5 text-center border rounded">
        <h4 class="my-5">{{ note.title }}</h4>
        <p>{{ note.text }}</p>
        <a href="{% url 'note.list' %}" class="btn btn-secondary my-5">Back</a>
        <a href="{% url 'note.update' pk=note.id %}" class="btn btn-success">Edit</a>
        <a href="{% url 'note.delete' pk=note.id %}" class="btn btn-danger">Delete</a>
    </div>
{% endblock %}
